name: Update Google Scholar Publications

on:
  schedule:
    # Berjalan otomatis setiap Senin jam 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Memungkinkan Anda menjalankan pembaruan manual kapan saja dari tab Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scholarly

      - name: Fetch Scholar Publications
        run: python fetch_scholar.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add _publications/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update publications from Google Scholar" && git push)
