name: Convert BibTeX to Publications

on:
  push:
    paths:
      - 'publications.bib' # Otomatis jalan setiap kali Anda memperbarui file publications.bib
  workflow_dispatch: # Bisa dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Convert BibTeX to Markdown
        run: python import_bib.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add _publications/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-convert BibTeX to publication pages" && git push)
